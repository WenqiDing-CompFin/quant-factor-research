[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducible-multifactor-research"
version = "0.1.0"
description = "An educational and auditable monthly equity factor research pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "WenqiDing-CompFin"}
]
license = {file = "LICENSE"}
keywords = ["quantitative-finance", "factor-investing", "backtesting", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "matplotlib>=3.6,<4",
  "bottleneck>=1.3.6,<2",
  "scipy>=1.10,<2"
]

[project.urls]
Repository = "https://github.com/WenqiDing-CompFin/quant-factor-research"
Issues = "https://github.com/WenqiDing-CompFin/quant-factor-research/issues"

[project.optional-dependencies]
dev = ["pytest>=7,<9", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"run_*.py" = ["E402"]
"tests/*" = ["E402", "E501", "S101"]
